name: Kiadás

# Címke (tag) feltöltésekor épít és csatol a release-hez:
#   v1.2.3          -> Windowsos Szemkimelo.exe
#   android-v1.2.3  -> aláírt Androidos APK
on:
  push:
    tags:
      - "v*"
      - "android-v*"

permissions:
  contents: write

jobs:
  windows:
    if: startsWith(github.ref_name, 'v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Függőségek
        run: pip install -r requirements.txt pyinstaller

      - name: Exe építése
        run: python -m PyInstaller --noconfirm --onefile --windowed --name Szemkimelo szemkimelo.py

      - name: Csatolás a release-hez
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Szemkímélő $TAG" --generate-notes
          gh release upload "$TAG" dist/Szemkimelo.exe --clobber

  android:
    if: startsWith(github.ref_name, 'android-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Kulcsfájl visszaállítása a titokból
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Hiányzik az ANDROID_KEYSTORE_BASE64 titok"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: APK építése
        env:
          SZK_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          SZK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SZK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SZK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain
          cp app/build/outputs/apk/release/app-release.apk Szemkimelo-android.apk

      - name: Aláírás ellenőrzése
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -n 1)
          "$APKSIGNER" verify --print-certs Szemkimelo-android.apk | head -n 3

      - name: Csatolás a release-hez
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Szemkímélő Android $TAG" --generate-notes
          gh release upload "$TAG" Szemkimelo-android.apk --clobber
